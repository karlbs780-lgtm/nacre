name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Installer plateforme et build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler l'APK
        run: |
          FILE=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts introuvable. Contenu du dépôt :"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Projet trouvé dans : $DIR"
          cd "$DIR"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nacre-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
